name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PET.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PET-apk
          path: PET.apk

      - name: Publish download link
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pet-latest
          name: P.E.T latest build
          prerelease: true
          files: PET.apk
          body: |
            Latest P.E.T build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **PET.apk** on your phone and open it to install.
